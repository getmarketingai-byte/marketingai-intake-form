<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pre-Call Intake Form | MarketingAI</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: #f8f9fa; padding: 20px; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .container { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); max-width: 500px; width: 100%; }
        h1 { color: #1a1a2e; margin-bottom: 8px; font-size: 24px; }
        .subtitle { color: #666; margin-bottom: 32px; font-size: 14px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #333; font-weight: 500; font-size: 14px; }
        input, select, textarea { width: 100%; padding: 12px 16px; border: 2px solid #e5e5e5; border-radius: 8px; font-size: 16px; transition: border-color 0.2s; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #0066ff; }
        textarea { resize: vertical; min-height: 80px; }
        .radio-group { display: flex; gap: 12px; flex-wrap: wrap; }
        .radio-option { display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .radio-option input { width: auto; }
        button { background: #0066ff; color: white; border: none; padding: 14px 28px; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; width: 100%; transition: background 0.2s; }
        button:hover { background: #0052cc; }
        .success { display: none; text-align: center; padding: 40px; }
        .success h2 { color: #22c55e; margin-bottom: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <div id="formContainer">
            <h1>Pre-Call Intake</h1>
            <p class="subtitle">Help us prepare for your strategy call</p>
            
            <form id="intakeForm">
                <div class="form-group">
                    <label for="industry">Industry / Business Type *</label>
                    <input type="text" id="industry" name="industry" required placeholder="e.g., Real Estate, Health & Wellness, Trade Services">
                </div>
                
                <div class="form-group">
                    <label for="painPoint">Current Marketing Pain Point *</label>
                    <textarea id="painPoint" name="painPoint" required placeholder="What's your biggest marketing challenge right now?"></textarea>
                </div>
                
                <div class="form-group">
                    <label for="budget">Budget Range *</label>
                    <select id="budget" name="budget" required>
                        <option value="">Select a range</option>
                        <option value="self-serve">$0 - Self-serve tools only</option>
                        <option value="500-1500">$500 - $1,500 / month</option>
                        <option value="1500-3000">$1,500 - $3,000 / month</option>
                        <option value="3000+">$3,000+ / month</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Implementation Timeline *</label>
                    <div class="radio-group">
                        <label class="radio-option">
                            <input type="radio" name="timeline" value="urgent" required> Urgent
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="timeline" value="30-days"> 30 days
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="timeline" value="90-days"> 90 days
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="timeline" value="exploring"> Just exploring
                        </label>
                    </div>
                </div>
                
                <button type="submit">Submit</button>
            </form>
        </div>
        
        <div id="successMessage" class="success">
            <h2>Thank You!</h2>
            <p>Your intake form has been received. We'll review your details before our call.</p>
        </div>
    </div>
    
    <script>
        document.getElementById('intakeForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const data = Object.fromEntries(formData.entries());
            
            const timeline = document.querySelector('input[name="timeline"]:checked');
            if (timeline) data.timeline = timeline.value;
            data.timestamp = new Date().toISOString();
            data.source = 'pre-call-intake';
            
            const emailBody = Object.entries(data).map(([k,v]) => k + ': ' + v).join('\n');
            
            try {
                const response = await fetch('https://api.postmail.in/v2/send/ct_wQqJq0V6L0r5g6rY5Y4g3Y5L0r5g6rY5', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        to: 'getmarketingai@gmail.com',
                        subject: 'New Pre-Call Intake: ' + (data.industry || 'New lead'),
                        text: emailBody
                    })
                });
                
                if (response.ok) {
                    document.getElementById('formContainer').style.display = 'none';
                    document.getElementById('successMessage').style.display = 'block';
                } else {
                    alert('Form submission failed. Please try again.');
                }
            } catch (error) {
                alert('Error submitting form. Please try again.');
            }
        });
    </script>
</body>
</html>
